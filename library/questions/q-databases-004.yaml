text: >-
  В чём ключевое отличие между индексами B-tree и GIN в PostgreSQL с точки зрения поддержки типов
  данных и операций?
options:
  - B-tree работает только с числами, GIN — только с текстом
  - >-
    B-tree оптимален для точечного поиска по скалярным значениям, GIN — для полнотекстового поиска и
    массивов
  - B-tree поддерживает транзакции, GIN — нет
  - GIN всегда быстрее B-tree на любых запросах
