text: Какие из перечисленных утверждений о ключевом слове volatile в Java верны?
options:
  - Гарантирует видимость изменений между потоками
  - Устраняет необходимость в синхронизации для составных операций
  - Запрещает переупорядочивание операций чтения/записи
  - Обеспечивает атомарность операций инкремента
correct: 1
explanation: >-
  volatile гарантирует видимость и порядок, но не атомарность и не заменяет синхронизацию для
  read-modify-write.
