text: Для чего нужен индекс в реляционной БД?
options:
  - Ускорить выборки по условиям
  - Обязательно хранить все данные в памяти
  - Заменить PRIMARY KEY
  - Удалить дубликаты строк автоматически
correct: 1
explanation: Индекс ускоряет поиск и фильтрацию ценой дополнительных затрат на запись и хранение.
